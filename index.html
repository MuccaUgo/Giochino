</script><script>(()=>{
 const $=id=>document.getElementById(id),map=$('map'),c=map.getContext('2d'),ground=document.createElement('canvas');

 const buttons=[...document.querySelectorAll('.choice')],names={principessa:'Principessa',cavaliere:'Cavaliere'};

 const arg=new URLSearchParams(location.hash.slice(1)).get('partita');
 const room=/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(arg||'')?arg:defaultRoom;
 const token=crypto.randomUUID(),endpoint=service.url+'/rest/v1/rpc/portolume_visit';
 let mine=null,seats={},available=false,pending=false,chain=Promise.resolve(),tasks=0,point=null,me=null,next=0,lastSync=0;

   $('status').parentElement.classList.toggle('online',available);
   for(const b of buttons){const role=b.dataset.role,occupied=!!seats[role];b.disabled=!available||pending||occupied;b.querySelector('.avail').textContent=occupied?'Già scelto':available?'Disponibile':'Verifica…';}
   $('msg').textContent=message||(available?(Object.keys(seats).length===2?'Entrambi i ruoli sono occupati.':'Scegli un ruolo per entrare nel cortile.'):'Verifico i posti sul server…');
 }
 function call(op,wanted=null){
   tasks++;
   const job=chain.then(async()=>{
     const data={r:room,k:token,op,wanted,px:op==='pulse'&&me?me.x:null,py:op==='pulse'&&me?me.y:null};

     try{
       const res=await fetch(endpoint,{method:'POST',headers:{apikey:service.key,'Content-Type':'application/json'},body:JSON.stringify(data),signal:abort.signal,cache:'no-store'});

       const ans=await res.json();if(!ans||!ans.seats||typeof ans.ok!=='boolean')throw Error('Risposta non valida.');

 }
 for(const b of buttons){actor(b.querySelector('canvas').getContext('2d'),19,35,b.dataset.role);b.onclick=async()=>{

 };}

   let url;if(location.protocol==='file:'){url='Apri lo stesso file Portolume.html sul secondo dispositivo.';}else{const u=new URL(location.href);u.hash='partita='+room;url=u.href;}
   try{if(location.protocol==='file:')throw Error();await navigator.clipboard.writeText(url);$('share').textContent='Link copiato';setTimeout(()=>$('share').textContent='Copia link partita',1600);}
   catch{$('linkbox').hidden=false;const el=$('linkbox').querySelector('input');el.value=url;el.select();}
 };
 const limit=(n,l,h)=>Math.max(l,Math.min(h,n));

 function render(now){
